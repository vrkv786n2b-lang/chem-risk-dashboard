<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한솔케미칼 전주공장 위험성평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}
/* Layout: white cards on a soft warm-grey ground, one violet accent; header → tab bar → per-tab views */
:root{
  --bg:#f2f1ee; --card:#ffffff; --ink:#26243a; --muted:#6c6a7e; --faint:#9c9aad; --line:#e6e4ec; --track:#efeee9;
  --accent:#5446c2; --accent-ink:#ffffff; --accent-soft:#eeecfb;
  --ok:#7fbd52; --warn:#eea12e; --high:#df6530; --crit:#dc4545;
  --ok-soft:#e8f4de; --warn-soft:#fcefda; --high-soft:#fae4d9; --crit-soft:#fae1e1; --g1-soft:#eceef0; --g1:#7b8794;
  --q1:#efedfb; --q1b:#d6d0f5; --q2:#e2f2ec; --q2b:#bde2d4; --q3:#fbefdc; --q3b:#f1d19b; --q4:#fbe7ee; --q4b:#f1c5d3;
  --overlay:rgba(30,28,46,.42);
  --f-body:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15141c; --card:#1f1e29; --ink:#ecebf4; --muted:#a6a4b8; --faint:#7a788d; --line:#322f40; --track:#2b2937;
  --accent:#9187f2; --accent-ink:#15141c; --accent-soft:#2a2645;
  --ok:#8fcf62; --warn:#f2b04a; --high:#ef8150; --crit:#f06a6a;
  --ok-soft:#24301d; --warn-soft:#3a2f1a; --high-soft:#3b2519; --crit-soft:#3d1f22; --g1-soft:#2a2c33; --g1:#9aa5b1;
  --q1:#26233d; --q1b:#3d3866; --q2:#1c2e29; --q2b:#2f5246; --q3:#33291b; --q3b:#5e4a24; --q4:#35202a; --q4b:#5c3446;
  --overlay:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15141c; --card:#1f1e29; --ink:#ecebf4; --muted:#a6a4b8; --faint:#7a788d; --line:#322f40; --track:#2b2937;
  --accent:#9187f2; --accent-ink:#15141c; --accent-soft:#2a2645;
  --ok:#8fcf62; --warn:#f2b04a; --high:#ef8150; --crit:#f06a6a;
  --ok-soft:#24301d; --warn-soft:#3a2f1a; --high-soft:#3b2519; --crit-soft:#3d1f22; --g1-soft:#2a2c33; --g1:#9aa5b1;
  --q1:#26233d; --q1b:#3d3866; --q2:#1c2e29; --q2b:#2f5246; --q3:#33291b; --q3b:#5e4a24; --q4:#35202a; --q4b:#5c3446;
  --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.head{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;padding:22px 28px}
.brand h1{font-size:22px;font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand h1 .flask{font-size:20px}
.brand .ver{font-size:12px;color:var(--faint);font-weight:400}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:6px 26px;flex-wrap:wrap}
.stat{text-align:center;min-width:56px}
.stat b{display:block;font-size:22px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--crit)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;overflow-x:auto}
.tab{border:0;background:transparent;border-radius:8px;padding:11px 12px;cursor:pointer;color:var(--muted);font-size:15px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.tab:hover{background:var(--accent-soft);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
@media (max-width:820px){.tabs{display:flex}.tab{flex:0 0 auto;font-size:14px}}

/* generic */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{padding:20px 22px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:500}
.section-title{font-size:18px;font-weight:500;padding-left:12px;border-left:3px solid var(--accent);line-height:1.2}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:6px}
.btn.danger:hover,.btn.armed{border-color:var(--crit);color:var(--crit)}
.btn.armed{background:var(--crit-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea.input{resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);outline:none}
.search{max-width:260px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
label.f > span b{color:var(--crit);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:12px;color:var(--faint);line-height:1.5}

/* bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:84px 1fr 28px;gap:12px;align-items:center;font-size:13.5px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.track{height:7px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s ease}

/* activity */
.acts{list-style:none;margin:0;padding:0}
.acts li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.acts li:last-child{border-bottom:0}
.acts b{font-weight:600}
.acts .d{color:var(--muted)}
.empty{color:var(--faint);font-size:13px;padding:14px 0}

/* quick start */
.quick{padding:24px 28px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}
@media (max-width:900px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.qgrid{grid-template-columns:minmax(0,1fr)}}
.qcard{text-align:left;border-radius:10px;padding:18px;cursor:pointer;border:1px solid;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .15s ease}
.qcard:hover{transform:translateY(-2px)}
.qcard .ic{font-size:24px;line-height:1}
.qcard b{font-weight:500;font-size:16px;margin-top:8px}
.qcard span{font-size:12.5px;color:var(--muted)}
.q1{background:var(--q1);border-color:var(--q1b)}.q2{background:var(--q2);border-color:var(--q2b)}.q3{background:var(--q3);border-color:var(--q3b)}.q4{background:var(--q4);border-color:var(--q4b)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-high{background:var(--high-soft);color:var(--high)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-g1{background:var(--g1-soft);color:var(--g1)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.cmr{font-size:10.5px;font-weight:600;letter-spacing:.04em;border:1px solid currentColor;border-radius:4px;padding:0 4px;color:var(--crit)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.02em;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td .sub{display:block;font-size:12px;color:var(--muted)}
.hc{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);max-width:220px;line-height:1.5}
.right{text-align:right}
.nowrap{white-space:nowrap}
.acts-cell{display:flex;gap:6px;justify-content:flex-end}

/* matrix */
.matrix{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:4px;font-size:12px}
.matrix .ax{color:var(--muted);display:flex;align-items:center;justify-content:center;padding:4px;text-align:center}
.matrix .cell{border-radius:6px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;position:relative;border:2px solid transparent}
.matrix .cell .r{font-size:10.5px;opacity:.75}
.matrix .cell .n{font-size:16px;font-weight:600}
.matrix .cell.on{border-color:var(--ink)}
.c-low{background:var(--ok-soft);color:var(--ok)}.c-mid{background:var(--warn-soft);color:var(--warn)}.c-high{background:var(--high-soft);color:var(--high)}.c-crit{background:var(--crit-soft);color:var(--crit)}
.matrix-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:8px;gap:8px;flex-wrap:wrap}

/* priority list */
.prio{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prio li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prio li:last-child{border-bottom:0}
.score{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.prio .t{min-width:0}
.prio .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio .t span{font-size:12px;color:var(--muted)}

/* banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13px;border:1px dashed var(--q1b)}

/* reports */
.report{padding:18px 22px}
.report + .report{margin-top:0}
.rep-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.rep-h h3{font-size:15.5px;font-weight:500}
.rep-h .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ratio{display:flex;align-items:center;gap:8px;min-width:130px}
.ratio .track{flex:1;height:6px;min-width:60px}
.ratio span{font-variant-numeric:tabular-nums;font-size:12.5px;width:48px;text-align:right}
.stack{display:flex;flex-direction:column;gap:14px}

/* assess */
.assess-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.assess-grid{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg input:checked + span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.calc{position:sticky;top:12px}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1.2fr;gap:8px;align-items:center;text-align:center;margin:6px 0 18px}
.eq .box{border:1px solid var(--line);border-radius:10px;padding:12px 6px}
.eq .box small{display:block;font-size:11.5px;color:var(--muted)}
.eq .box b{display:block;font-size:28px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.eq .op{color:var(--faint);font-size:18px}
.basis{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:14px;line-height:1.6}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.verdict .lvl{font-size:15px;font-weight:600}
.sub-h{font-size:13px;font-weight:500;color:var(--muted);margin:18px 0 8px;letter-spacing:.02em}
fieldset{border:0;padding:0;margin:0;min-width:0}

/* ref */
.ref-tbl td,.ref-tbl th{font-size:12.5px}
.codes{font-family:var(--f-mono);font-size:12px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:720px;margin-top:4vh;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.modal.wide{max-width:980px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px;font-weight:600}
.modal-b{padding:18px 22px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--track)}
.rrows{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:1fr 1.1fr 1.3fr .8fr .8fr .8fr auto;gap:6px;align-items:end}
.rrow .input{padding:7px 8px;font-size:13px}
.rrow-h{display:grid;grid-template-columns:1fr 1.1fr 1.3fr .8fr .8fr .8fr auto;gap:6px;font-size:11.5px;color:var(--muted)}
.rrow-h span:last-child{width:32px}
@media (max-width:760px){.rrow-h{display:none}.rrow{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px}.rrow .rm{grid-column:1/-1}}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
/* groups & view switch */
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;background:var(--card)}
.vseg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.vseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vseg button:not([aria-pressed="true"]):hover{background:var(--accent-soft);color:var(--ink)}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.grp{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.grp + .grp{margin-top:12px}
.grp-h{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--bg);cursor:pointer;flex-wrap:wrap;border:0;width:100%;text-align:left}
.grp-h:hover{background:var(--accent-soft)}
.grp-h .car{width:16px;color:var(--muted);transition:transform .15s;flex:none}
.grp.closed .grp-h .car{transform:rotate(-90deg)}
.grp.closed .grp-b{display:none}
.grp-h .ttl{flex:1;min-width:200px}
.grp-h .ttl b{font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grp-h .ttl span{font-size:12px;color:var(--muted)}
.grp-h .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp-b{padding:4px 12px 8px}
.grp-b .grp-acts{display:flex;justify-content:flex-end;gap:6px;padding:8px 0 2px;flex-wrap:wrap}
.grp-stripe{width:4px;align-self:stretch;border-radius:2px;flex:none}
/* 사업장·날씨 */
.mapwrap{position:relative}
.mapwrap .sitemap{height:280px!important}
.mapwrap iframe{pointer-events:none}
.maplabel{position:absolute;left:50%;top:calc(50% - 64px);transform:translateX(-50%);pointer-events:none;z-index:2}
.maplabel span{display:block;white-space:nowrap;background:#1f1d33;color:#fff;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.3);position:relative}
.maplabel span::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#1f1d33}
.mapring{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid rgba(220,69,69,.85);pointer-events:none;animation:ring 1.8s ease-out infinite;z-index:2}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.mapring{animation:none;opacity:.7}}
.maptg{display:flex;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);overflow:hidden}
.maptg button{border:0;background:#fff;color:#333;font:600 12px/1 var(--f-body);padding:7px 11px;cursor:pointer}
.maptg button[aria-pressed="true"]{background:#5446c2;color:#fff}

.sitemap{height:260px!important}
#siteMap{z-index:0}
.site-pin{background:none;border:0}
.sitemap .site-pin .pin-l{pointer-events:none}
.site-pin .pin{position:absolute;left:4px;top:0;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--crit);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.site-pin .pin span{transform:rotate(45deg);font-size:16px}
.site-pin .pin-l{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:#1f1d33;color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.site-pin .pin-pulse{position:absolute;left:12px;top:44px;width:20px;height:8px;border-radius:50%;background:rgba(220,69,69,.45);animation:pp 1.8s ease-out infinite}
@keyframes pp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.site-pin .pin-pulse{animation:none}}
.wxsrc{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;margin:-6px 0 8px}
.wxsrc.kma,.wxsrc.kmam{background:var(--accent-soft);color:var(--accent)}.wxsrc.om{background:var(--warn-soft);color:var(--warn)}
.addr{margin:0 0 10px;display:flex;flex-direction:column;gap:2px}.addr b{font-weight:600}.addr span{color:var(--muted);font-size:13px}
.sitemap{width:100%;height:220px;border:1px solid var(--line);border-radius:8px;display:block;background:var(--track)}
.sitemap.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12.5px}.sitemap.ph span:first-child{font-size:28px}
a.btn{text-decoration:none;color:inherit}
.wxnow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wxic{font-size:44px;line-height:1}
.wxnow > div b{display:block;font-size:30px;font-weight:600;line-height:1.1}.wxnow > div span{font-size:13px;color:var(--muted)}
.wxm{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:4px 16px;margin:0 0 0 auto;font-size:12.5px}
.wxm div{display:flex;gap:6px}.wxm dt{color:var(--muted)}.wxm dd{margin:0}
.arrow{display:inline-block;font-weight:700;color:var(--accent)}
.wxadv{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:12.5px}
.wxadv > div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.wxadv > div > span:last-child{flex:1;min-width:180px}
.wxdays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.wxd{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.wxd small{font-size:11.5px;color:var(--muted)}.wxd .ic{font-size:22px}
@media (max-width:560px){.wxm{margin-left:0;grid-template-columns:minmax(0,1fr)}}
/* MSDS 등록 화면 */
.modal.studio{max-width:1400px;margin-top:0;height:calc(100vh - 48px);display:flex;flex-direction:column}
.modal.studio #mform{display:flex;flex-direction:column;height:100%;min-height:0}
.modal.studio .modal-h{padding:12px 20px}
.modal.studio .modal-b{flex:1;min-height:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pv{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--track)}
.pv-tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.pv-tb .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pv-tb .btn.hot:not(.on){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tb-g{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:7px;padding:2px}
.ib{border:0;background:transparent;border-radius:5px;min-width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:13px}
.ib:hover:not(:disabled){background:var(--accent-soft)}.ib:disabled{opacity:.4}
.pgl,.zl{font-size:12.5px;min-width:52px;text-align:center;color:var(--muted)}
.fsel{width:auto;max-width:210px;padding:5px 8px;font-size:12.5px;margin-left:auto}
.pv-scroll{flex:1;overflow:auto;padding:14px;min-height:0;position:relative}
.pv-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.pv-page{position:relative;margin:0 auto 14px;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
.pv-page canvas{display:block}
.hl{position:absolute;border-radius:3px;background:rgba(84,70,194,.16);outline:1.5px solid rgba(84,70,194,.75);pointer-events:none}
.hl[data-l]::after{content:attr(data-l);position:absolute;left:0;top:-15px;font-size:10px;line-height:13px;padding:0 4px;border-radius:3px;background:rgba(84,70,194,.9);color:#fff;white-space:nowrap}
.hl.flash{background:rgba(238,161,46,.28);outline:2px solid rgba(223,101,48,.95);animation:fl 1s ease 2}
@keyframes fl{50%{background:rgba(238,161,46,.05)}}
.sec3{position:absolute;outline:2.5px solid rgba(84,70,194,.85);border-radius:4px;background:rgba(84,70,194,.04);pointer-events:none;box-shadow:0 0 0 9999px rgba(20,18,40,.12)}
.sec3::before{content:"3. 구성성분";position:absolute;right:0;top:-20px;font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(84,70,194,.95);color:#fff}
.fm{overflow:auto;min-height:0;padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.chips-bar{position:sticky;top:0;z-index:2;background:var(--card);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:500}
.c-auto{background:var(--ok-soft);color:var(--ok)}.c-ok{background:var(--g1-soft);color:var(--g1)}.c-req{background:var(--crit-soft);color:var(--crit)}.c-opt{background:var(--warn-soft);color:var(--warn)}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.prog .track{width:110px;height:6px}
.auto-sum{border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft);border-radius:10px;padding:12px 14px}
.auto-sum.s-plain{background:var(--bg);border-color:var(--line)}.auto-sum.s-warnbox{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.auto-sum > b{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:10px}
.tile{background:var(--card);border-radius:7px;padding:7px 9px;min-width:0}
.tile small{display:block;font-size:11px;color:var(--muted)}
.tile span{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-all}
.mixsw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--q4b);background:var(--q4);border-radius:10px;cursor:pointer}
.mixsw > span{display:flex;flex-direction:column;gap:2px}.mixsw b{font-weight:500}
.mixsw input{position:absolute;opacity:0;pointer-events:none}
.sw{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.mixsw input:checked + .sw{background:var(--accent)}.mixsw input:checked + .sw::after{transform:translateX(18px)}
.mixsw input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.fsec-h{display:flex;justify-content:space-between;align-items:center;font-weight:500;padding-left:10px;border-left:3px solid var(--accent);margin-bottom:10px;font-size:13.5px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;transition:background .15s,border-color .15s}
.fcard.full{grid-column:1/-1}
.fcard .fh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.fcard .fh .toolbar{gap:6px}
.s-auto{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.s-ok{background:var(--card)}
.s-man{background:var(--card);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.s-miss{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.s-req{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.s-info{background:var(--bg)}
.bdg{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:500;margin-left:4px}
.bd-auto{background:var(--card);color:var(--ok)}.bd-ok{background:var(--g1-soft);color:var(--g1)}.bd-man{background:var(--accent-soft);color:var(--accent)}.bd-miss{background:var(--card);color:var(--warn)}.bd-req{background:var(--card);color:var(--crit)}
.ckb{border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:11.5px;padding:2px 9px;cursor:pointer;color:var(--muted)}

<script>

const fmtD=s=>{if(!s)return '-';const [y,m,d]=s.split('-');return `${y}. ${+m}. ${+d}.`};
const fmtN=n=>{if(n==null||n==='')return '-';const v=Number(n);return Number.isInteger(v)?String(v):String(+v.toFixed(3))};

/* ---------- 기준 ---------- */

  if(r<=12) return {k:'high',p:'p-high',t:'높음',a:'개선 필요 · 우선 개선'};
  return {k:'crit',p:'p-crit',t:'매우 높음',a:'즉시 개선 · 작업 중지 검토'};
}
const expoFromRatio=p=>p<10?1:p<50?2:p<100?3:4;
const expoSemi=(amount,vol,lev)=>{const row=SEMI[amount]||SEMI['중량'];let e=row[Math.max(0,VOLS.indexOf(vol))];if(lev)e=Math.max(1,e-1);return e};

function hcodes(str){return ((str||'').toUpperCase().match(/H\d{3}[A-Z]*/g)||[])}
function gradeOf(m){
  const bases=[...new Set(hcodes(m.hcodes).map(c=>c.slice(0,4)))];
  let g=1,auto=1;const G=S.settings.grade;
  for(const lv of [4,3,2]){if(bases.some(b=>(G[lv]||[]).includes(b))){auto=lv;break}}
  g=m.override?Number(m.override):auto;
  const cmr=bases.some(b=>CMR_BASES.includes(b));
  return {g,auto,cmr,bases};
}
function msdsStatus(m){
  if(!m.rev) return {t:'개정일 없음',p:'p-g1',k:'none',days:null,exp:null};

  if(days<0) return {t:'만료',p:'p-crit',k:'expired',days,exp};
  if(days<=S.settings.warnDays) return {t:'만료 임박',p:'p-warn',k:'soon',days,exp};

}

/* ---------- 샘플 ---------- */

   {product:'에폭시 도료 EP-50',name:'메틸에틸케톤',cas:'78-93-3',content:'10~20',supplier:'대성코팅(예시)',rev:'2023-05-10',hcodes:'H225, H319, H336',twa:200,unit:'ppm',bp:80,process:'조색'},
   {product:'세정제 IPA-99',name:'이소프로필알코올',cas:'67-63-0',content:'99',supplier:'한빛케미칼(예시)',rev:'2025-09-03',hcodes:'H225, H319, H336',twa:200,unit:'ppm',bp:82,process:'검사'}
  ],
  report:{title:'2026년 상반기 작업환경측정 · 도장동',date:'2026-05-20',agency:'OO산업보건센터(예시)',
   results:[['톨루엔','도장','스프레이 부스 #1',22.4],['크실렌','도장','스프레이 부스 #1',61],['에틸벤젠','도장','스프레이 부스 #1',8.2],['메틸에틸케톤','조색','조색실',35],['이소프로필알코올','검사','외관검사대',12]]},
  improve:{'크실렌':'부스 배기 풍량 점검(제어풍속 0.5 m/s 이상 유지), 유기화합물용 방독마스크 착용 확인'}
 },

  msds:[
   {product:'탈지 세척제 DG-7',name:'트리클로로에틸렌',cas:'79-01-6',content:'95~100',supplier:'세진화학(예시)',rev:'2024-02-20',hcodes:'H315, H317, H319, H336, H341, H350, H412',twa:10,unit:'ppm',bp:87,process:'세척'},
   {product:'박리제 PR-3',name:'디클로로메탄',cas:'75-09-2',content:'70~80',supplier:'세진화학(예시)',rev:'2023-12-28',hcodes:'H315, H319, H336, H350, H373',twa:50,unit:'ppm',bp:40,process:'세척'},
   {product:'고무 접착제 RB-11',name:'노말헥산',cas:'110-54-3',content:'30~40',supplier:'동우본드(예시)',rev:'2025-06-30',hcodes:'H225, H304, H315, H336, H361f, H373, H411',twa:50,unit:'ppm',bp:69,process:'접착'},
   {product:'페놀수지 접착제 PF-2',name:'포름알데히드',cas:'50-00-0',content:'0.1~1',supplier:'동우본드(예시)',rev:'2023-04-02',hcodes:'H301, H311, H331, H314, H317, H341, H350',twa:0.3,unit:'ppm',bp:-19,process:'접착'},
   {product:'세척용 솔벤트 SV-10',name:'메탄올',cas:'67-56-1',content:'60~70',supplier:'세진화학(예시)',rev:'2025-01-15',hcodes:'H225, H301, H311, H331, H370',twa:200,unit:'ppm',bp:65,process:'세척'},
   {product:'세척용 솔벤트 SV-10',name:'벤젠',cas:'71-43-2',content:'<0.1',supplier:'세진화학(예시)',rev:'2025-01-15',hcodes:'H225, H304, H315, H319, H340, H350, H372',twa:0.5,unit:'ppm',bp:80,process:'세척'}

function loadSample(n,silent){
  const sp=SAMPLES[n];if(!sp)return;
  const tag='s'+n;
  if(S.msds.some(m=>m.sample===tag)){if(!silent)toast(sp.label+' 데이터는 이미 들어 있어요');return}
  const map={};
  sp.msds.forEach(x=>{const m=Object.assign({id:uid(),override:'',sample:tag,created:todayISO()},x);S.msds.push(m);map[x.name]=m});
  const rep={id:uid(),title:sp.report.title,date:sp.report.date,agency:sp.report.agency,sample:tag,results:sp.report.results.map(([nm,pr,pl,v])=>{const m=map[nm];return {id:uid(),msdsId:m.id,name:m.name,cas:m.cas,process:pr,place:pl,value:v,limit:m.twa,unit:m.unit}})};
  S.reports.push(rep);
  rep.results.forEach(r=>{const a=assessFromResult(r,rep);if(a){a.sample=tag;a.date=addDays(rep.date,14);const imp=(sp.improve||{})[r.name];if(imp)a.improve=imp;a.current=a.current||'국소배기장치 운영, 개인보호구 지급';a.owner=a.risk>=9?'생산팀(예시)':'';a.due=a.risk>=9?addDays(rep.date,75):'';a.status=a.risk>=5?'조치 대기':'해당 없음';S.assess.push(a)}});
  (sp.semi||[]).forEach(s=>{const m=map[s.name];const g=gradeOf(m);const e=expoSemi(s.amount,s.vol,s.lev);S.assess.push({id:uid(),sample:tag,date:addDays(rep.date,14),process:m.process,place:s.place,msdsId:m.id,name:m.name,cas:m.cas,product:m.product,grade:g.g,cmr:g.cmr,method:'반정량',amount:s.amount,vol:s.vol,lev:s.lev,exposure:e,risk:g.g*e,current:s.current,improve:'',owner:'',due:'',status:g.g*e>=5?'조치 대기':'해당 없음'})});
  addLog('📝',sp.label+' 샘플 데이터 로드');

function clearSamples(){

function allResults(){const out=[];S.reports.forEach(rep=>rep.results.forEach(r=>out.push(Object.assign({},r,{repId:rep.id,date:rep.date,repTitle:rep.title}))));return out.sort((a,b)=>b.date.localeCompare(a.date))}
function resultsFor(m){return allResults().filter(r=>r.msdsId===m.id||(m.cas&&r.cas&&r.cas===m.cas))}
function assessFromResult(r,rep){
  const m=S.msds.find(x=>x.id===r.msdsId);if(!m||!(r.limit>0)||r.value===''||r.value==null)return null;
  const g=gradeOf(m);const ratio=r.value/r.limit*100;const e=expoFromRatio(ratio);
  return {id:uid(),date:todayISO(),process:r.process,place:r.place,msdsId:m.id,name:m.name,cas:m.cas,product:m.product,grade:g.g,cmr:g.cmr,method:'측정',resultId:r.id,measured:r.value,limit:r.limit,unit:r.unit,ratio,measDate:rep.date,exposure:e,risk:g.g*e,current:'',improve:'',owner:'',due:'',status:g.g*e>=5?'조치 대기':'해당 없음'};
}

function feelsLike(T,RH,Vms,month){ // 기상청 체감온도: 여름(5~9월)은 습구온도 기반, 겨울은 풍속 기반

async function loadWeather(force){
  const st=S.settings.site;const key=KEY+':wx2';

function wxAdvice(N,aq){
  const out=[];const t=N.t,ap=N.ap,ws=N.ws;
  if(ap>=33)out.push(['p-crit','폭염 주의','체감 '+Math.round(ap)+'℃ · 보호구 착용 작업자 열스트레스 주의, 휴식·수분 보충']);
  if(t>=30)out.push(['p-high','증기 발생 증가','고온에서 유기용제 증발이 늘어요. 국소배기·밀폐 상태를 확인하세요']);
  if(ws>=9)out.push(['p-high','강풍','옥외 하역·이송 작업과 누출 시 확산에 주의하세요']);
  if(N.rain)out.push(['p-warn','강수','금수성 물질 보관 상태와 옥외 배관·바닥 미끄럼을 확인하세요']);
  if(N.thunder)out.push(['p-crit','낙뢰','인화성 물질 옥외 이송·충전 작업 자제, 정전기·낙뢰 주의']);
  if(t<=0)out.push(['p-warn','동결 주의','배관·밸브 동결과 결빙 미끄럼에 주의하세요']);

  if(!out.length)out.push(['p-ok','특이사항 없음','현재 기상 조건으로 인한 추가 조치는 필요하지 않아요']);
  return out;
}

function matrixHtml(counts,hl){

  for(let g=4;g>=1;g--){
    h+=`<div class="ax">${g}등급</div>`;
    for(let e=1;e<=4;e++){const r=g*e;const l=riskLevel(r);const on=hl&&hl[0]===g&&hl[1]===e;
      h+=`<div class="cell c-${l.k}${on?' on':''}"><span class="n">${counts?(counts[g+'-'+e]||'·'):r}</span>${counts?`<span class="r">위험성 ${r}</span>`:''}</div>`}
  }
  return h+`</div><div class="matrix-cap"><span><span class="pill p-ok">1~4 낮음</span> <span class="pill p-warn">6~8 보통</span> <span class="pill p-high">9~12 높음</span> <span class="pill p-crit">16 매우 높음</span></span></div>`;
}

  }

function rInfo(r){const ratio=r.limit>0?r.value/r.limit*100:null;const e=ratio==null?null:expoFromRatio(ratio);return {ratio,e,col:EXPO_COL[e||0]}}
function ratioCell(r){const x=rInfo(r);return x.ratio==null?'<span class="muted">노출기준 없음</span>':`<div class="ratio"><div class="track"><div class="fill" style="width:${Math.min(100,x.ratio)}%;background:${x.col}"></div></div><span style="color:${x.col}">${x.ratio.toFixed(1)}%</span></div>`}
function expoCell(r){const x=rInfo(r);return (x.e?`<span class="pill" style="background:var(--track)">${x.e}</span>`:'-')+(x.ratio>=100?' <span class="pill p-crit">초과</span>':'')}
function doneCell(r,done){return done.has(r.id)?'<span class="pill p-acc">평가됨</span>':'<span class="muted">미평가</span>'}
function measMatch(r){const q=measQ.trim().toLowerCase();return !q||`${r.name} ${r.cas} ${r.process} ${r.place}`.toLowerCase().includes(q)}
function grpSummary(list){const rs=list.map(r=>rInfo(r).ratio).filter(x=>x!=null);const mx=rs.length?Math.max(...rs):null;const over=rs.filter(x=>x>=100).length;const e=mx==null?0:expoFromRatio(mx);
  return {mx,over,html:`${mx!=null?`<span class="pill" style="background:var(--track);color:${EXPO_COL[e]}">최고 ${mx.toFixed(1)}%</span>`:''}${over?`<span class="pill p-crit">초과 ${over}건</span>`:''}`,col:EXPO_COL[e]}}

function saveReport(id){
  const title=$('#f_rtitle').value.trim();if(!title){toast('보고서명을 입력하세요');$('#f_rtitle').focus();return false}
  const results=[];let bad=false;
  $$('#rrows .rrow').forEach(row=>{const msdsId=row.querySelector('.r_msds').value;const v=row.querySelector('.r_val').value;if(!msdsId&&v==='')return;if(!msdsId||v===''){bad=true;return}
    const m=S.msds.find(x=>x.id===msdsId);results.push({id:row.dataset.rid||uid(),msdsId,name:m.name,cas:m.cas,process:row.querySelector('.r_proc').value.trim(),place:row.querySelector('.r_place').value.trim(),value:Number(v),limit:row.querySelector('.r_lim').value===''?'':Number(row.querySelector('.r_lim').value),unit:row.querySelector('.r_unit').value})});
  if(bad){toast('각 결과 행에 물질과 측정값을 모두 입력하세요');return false}
  const d={title,date:$('#f_rdate').value||todayISO(),agency:$('#f_ragency').value.trim(),results};
  results.forEach(r=>{if(r.process&&!S.settings.processes.includes(r.process))S.settings.processes.push(r.process)});
  if(id){Object.assign(S.reports.find(x=>x.id===id),d);addLog('📈',title+' 수정')}
  else{S.reports.push(Object.assign({id:uid()},d));addLog('📈',title+' 등록')}
  save();render();toast(id?'보고서를 수정했어요':'측정 보고서를 등록했어요');
}
function batchAssess(reps){
  const done=new Set(S.assess.map(a=>a.resultId));let n=0,skip=0;
  reps.forEach(rep=>rep.results.forEach(r=>{if(done.has(r.id))return;const a=assessFromResult(r,rep);if(a){S.assess.push(a);n++}else skip++}));
  if(n)addLog('⚠️',`측정결과 ${n}건 위험성평가`);
  save();render();toast(n?`${n}건을 평가했어요${skip?` (노출기준 없는 ${skip}건 제외)`:''}`:'새로 평가할 측정결과가 없어요');
}

function readAssessForm(){
  const d=assessDraft;
  d.process=$('#a_process').value;d.place=$('#a_place').value;d.msdsId=$('#a_msds').value;
  d.method=($('input[name="a_method"]:checked')||{}).value||'측정';
  d.resultId=$('#a_meas').value;d.amount=$('#a_amount').value;d.vol=$('#a_vol').value;d.lev=$('#a_lev').checked;
  d.current=$('#a_current').value;d.improve=$('#a_improve').value;d.owner=$('#a_owner').value;d.due=$('#a_due').value;
  return d;
}
function computeDraft(){
  const d=assessDraft;const m=S.msds.find(x=>x.id===d.msdsId);if(!m)return null;
  const g=gradeOf(m);const out={m,g:g.g,cmr:g.cmr,bases:g.bases,method:d.method};
  if(d.method==='측정'){const r=allResults().find(x=>x.id===d.resultId);if(!r||!(r.limit>0)){out.missing=true;return out}
    out.r=r;out.ratio=r.value/r.limit*100;out.e=expoFromRatio(out.ratio)}
  else{out.e=expoSemi(d.amount,d.vol,d.lev)}
  out.risk=out.g*out.e;out.lv=riskLevel(out.risk);return out;
}
function fillMeasOptions(){

function bindAssess(){
  const upd=()=>{readAssessForm();$('#fs_meas').hidden=assessDraft.method!=='측정';$('#fs_semi').hidden=assessDraft.method!=='반정량';renderCalc()};
  $('#a_msds').addEventListener('change',()=>{readAssessForm();const m=S.msds.find(x=>x.id===assessDraft.msdsId);
    if(m){const v=volFromBp(m.bp);if(v){$('#a_vol').value=v;$('#a_volHint').textContent=`끓는점 ${m.bp}℃ → ${v} (자동 제안)`}if(!$('#a_process').value&&m.process)$('#a_process').value=m.process;
      if(!resultsFor(m).length){const r=$('input[name="a_method"][value="반정량"]');r.checked=true}}
    fillMeasOptions();upd()});
  $('#view').querySelector('.assess-grid').addEventListener('input',upd);
  $('#view').querySelector('.assess-grid').addEventListener('change',e=>{if(e.target.id==='a_meas'){readAssessForm();fillMeasOptions()}upd()});

function saveAssess(){
  readAssessForm();const d=assessDraft;
  if(!d.process.trim()){toast('공정을 입력하세요');$('#a_process').focus();return}
  const c=computeDraft();if(!c){toast('평가할 물질을 선택하세요');return}
  if(c.missing){toast('측정결과가 없어요. 취급량·휘발성 방식으로 바꿔 평가하세요');return}
  const a={id:uid(),date:todayISO(),process:d.process.trim(),place:d.place.trim(),msdsId:c.m.id,name:c.m.name,cas:c.m.cas,product:c.m.product,grade:c.g,cmr:c.cmr,method:c.method,exposure:c.e,risk:c.risk,current:d.current.trim(),improve:d.improve.trim(),owner:d.owner.trim(),due:d.due,status:c.risk>=5?'조치 대기':'해당 없음'};
  if(c.method==='측정')Object.assign(a,{resultId:c.r.id,measured:c.r.value,limit:c.r.limit,unit:c.r.unit,ratio:c.ratio,measDate:c.r.date});
  else Object.assign(a,{amount:d.amount,vol:d.vol,lev:d.lev});
  S.assess.push(a);if(!S.settings.processes.includes(a.process))S.settings.processes.push(a.process);
  addLog('⚠️',`${a.name} 위험성평가 (위험성 ${a.risk})`);save();
  assessDraft={method:d.method,amount:'중량',vol:'중간',lev:false,process:d.process};
  render();toast(`저장했어요 · 위험성 ${a.risk} ${riskLevel(a.risk).t}`);
}

function histRows(){

}

async function ensurePdf(){

}

      const ch=[];r.items.forEach(i=>{const last=ch[ch.length-1];if(last&&i.x-last.x2<=6){last.s+=(i.x-last.x2>1.2?' ':'')+i.s;last.x2=Math.max(last.x2,i.x+i.w);last.h=Math.max(last.h,i.h)}else ch.push({x1:i.x,x2:i.x+i.w,s:i.s,h:i.h})});
      ch.forEach(c=>c.s=c.s.replace(/\u00a0/g,' ').trim());pdfText.rows.push({page:p,y:r.y,h:Math.max(...r.items.map(i=>i.h)),ch:ch.filter(c=>c.s)});

}

    if(m){const num=parseInt((l.match(/[0-9]{1,2}/)||[])[0]);const rest=l.slice(m[0].length,m[0].length+40);if(num>cur&&num<=16&&SEC_KW[num].test(rest))n=num}

}

async function handlePdfFiles(files){

  if(!pdfs.length){toast('PDF 파일만 등록할 수 있어요');return}
  if(pdfBusy){pendingFiles.push(...pdfs);toast('지금 읽고 있는 PDF가 끝나면 이어서 처리할게요');return}
  pdfBusy=true;

  if(!inStudio)openModal('PDF 읽는 중',loadingHtml(pdfs[0].name,1,pdfs.length),'');
  else{const sc=$('#pvScroll');if(sc)sc.innerHTML=`<div class="pv-empty">${loadingHtml(pdfs[0].name,1,pdfs.length)}</div>`}

  for(let k=0;k<pdfs.length;k++){const f=pdfs[k];
    if(k){const el=inStudio?$('#pvScroll'):$('#modalBody');if(el)el.innerHTML=(inStudio?'<div class="pv-empty">':'')+loadingHtml(f.name,k+1,pdfs.length)+(inStudio?'</div>':'')}

    }catch(e){
      if(/script/.test(e.message||'')){pdfBusy=false;openModal('PDF 도구를 불러오지 못했어요','<p style="margin-top:0">PDF를 읽는 도구를 내려받지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도하거나, 직접 입력으로 등록하세요.</p>','<button type="button" class="btn" data-act="closeModal">닫기</button>');return}

function rectOf(div,c){const vp=div._vp;const r=vp.convertToViewportRectangle([c.x1-1.5,c.y-c.h*0.3,c.x2+1.5,c.y+c.h*0.95]);return {l:Math.min(r[0],r[2]),t:Math.min(r[1],r[3]),w:Math.abs(r[2]-r[0]),h:Math.abs(r[3]-r[1])}}

const NZ=t=>String(t||'').replace(/\s/g,'').toLowerCase();
function fieldBoxes(s,k){

  const out=[];const rowBox=r=>({page:r.page,x1:Math.min(...r.ch.map(c=>c.x1)),x2:Math.max(...r.ch.map(c=>c.x2)),y:r.y,h:r.h||10});
  const pushC=(r,c)=>out.push({page:r.page,x1:c.x1,x2:c.x2,y:r.y,h:c.h||r.h||10});
  if(k==='hcodes'){const cs=hcodes(val).map(x=>x.toUpperCase());s.rows.forEach(r=>r.ch.forEach(c=>{if(cs.some(h=>c.s.toUpperCase().includes(h)))pushC(r,c)}));return out}

  if(rowRe){s.rows.forEach(r=>{const t=r.ch.map(c=>c.s).join(' ');if(rowRe.test(t)&&(k!=='twa'||t.includes(String(val))))out.push(rowBox(r))});if(k==='rev')return out.slice(-1);return out.slice(0,4)}

function compBoxes(s,c){const out=[];[c.name,c.cas].filter(x=>filled(x)&&String(x).length>=2).forEach(v=>{const nv=NZ(v).slice(0,14);s.rows.forEach(r=>r.ch.forEach(ch=>{if(NZ(ch.s).includes(nv))out.push({page:r.page,x1:ch.x1,x2:ch.x2,y:r.y,h:ch.h||r.h||10})}))});return out}
function sec3Region(s){
  const rows=s.rows;const si=rows.findIndex(r=>isHeading(r)&&/^\s*3\s*[.．]/.test(r.ch[0].s)&&/구성성분|함유량|composition/i.test(rowText(r)));if(si<0)return null;

  const x1=Math.min(...inPg.flatMap(r=>r.ch.map(c=>c.x1)))-4,x2=Math.max(...inPg.flatMap(r=>r.ch.map(c=>c.x2)))+4;

function sec3Regions(s){
  const rows=s.rows;const si=rows.findIndex(r=>isHeading(r)&&/^\s*3\s*[.．]/.test(r.ch[0].s)&&/구성성분|함유량|composition/i.test(rowText(r)));if(si<0)return [];
  let ei=rows.findIndex((r,k)=>k>si&&isHeading(r)&&/^\s*4\s*[.．]/.test(r.ch[0].s));
  const p0=rows[si].page,p1=ei>=0?rows[ei].page:p0;const out=[];
  for(let pg=p0;pg<=p1;pg++){
    const inPg=rows.filter((r,k)=>k>=si&&(ei<0||k<ei)&&r.page===pg);if(!inPg.length)continue;
    const top=pg===p0?rows[si]:inPg[0];const yTop=top.y+(top.h||10)*1.15;
    const endRow=ei>=0&&rows[ei].page===pg?rows[ei]:null;const last=inPg[inPg.length-1];
    const yBot=endRow?endRow.y+(endRow.h||10)*1.15:last.y-(last.h||10)*0.7;
    out.push({page:pg,yTop,yBot,x1:Math.min(...inPg.flatMap(r=>r.ch.map(c=>c.x1))),x2:Math.max(...inPg.flatMap(r=>r.ch.map(c=>c.x2)))});
  }

function pvOverlay(div){

  if(v.show){activeKeys(s).forEach(k=>{if(k==='comps'){s.comps.filter(c=>c.on).forEach(c=>compBoxes(s,c).filter(b=>b.page===p).forEach(b=>addBox(div,b,'')))}else fieldBoxes(s,k).filter(b=>b.page===p).forEach((b,i)=>addBox(div,b,'',i?'':ST_FIELDS[k].label(s.mix)))})}

  measView:id=>{measView=id;try{localStorage.setItem(KEY+':xv',id)}catch(e){}render()},
  toggleGrp:id=>{const k=decodeURIComponent(id);grpClosed.has(k)?grpClosed.delete(k):grpClosed.add(k);render()},
  grpAll:id=>{const keys=$$('#view [data-act=toggleGrp]').map(b=>decodeURIComponent(b.dataset.id));keys.forEach(k=>id==='close'?grpClosed.add(k):grpClosed.delete(k));render()},
  addComp:id=>{const k=decodeURIComponent(id);const f=S.msds.find(x=>gkey(x)===k);if(!f)return;openModal('성분 추가 · '+(f.product||''),msdsForm({unit:'ppm',product:f.product,supplier:f.supplier,rev:f.rev,process:f.process,hcodes:f.hcodes}),null,()=>{const r=saveMsds();if(r===false)return false;const m=S.msds[S.msds.length-1];if(f.file){m.file=f.file;save();render()}});bindGradePreview()},
  delGrp:(id,b)=>{if(!armed(b,'한 번 더 누르면 전체 삭제'))return;const k=decodeURIComponent(id);const n=S.msds.filter(x=>gkey(x)===k).length;const f=S.msds.find(x=>gkey(x)===k);S.msds=S.msds.filter(x=>gkey(x)!==k);addLog('🗑️',`${f&&f.product||'MSDS'} 삭제 (${n}종)`);save();render();toast(`성분 ${n}종을 삭제했어요`)},
  wxRefresh:()=>loadWeather(true),
  mapEdit:()=>{if(mapEdit&&siteMarker){const ll=siteMarker.getLatLng();Object.assign(S.settings.site,{lat:+ll.lat.toFixed(6),lon:+ll.lng.toFixed(6),geo:'manual'});addLog('📍','사업장 위치 지정');save();try{localStorage.removeItem(KEY+':wx2')}catch(e){};mapEdit=false;render();toast('사업장 위치를 저장했어요');loadWeather(true);return}mapEdit=true;mapLayer='sat';render();toast('위성사진에서 공장 건물을 클릭하거나 핀을 끌어 맞추세요')},
  pickPdf:id=>{pdfPrefer=id||null;$('#pdfPick').click()},
  newMsds:()=>openStudio([newSession(null)]),
  stOk:id=>{const s=curS();s.ok[id]=!s.ok[id];updCard(id);refreshMeta();if(studio.view.show)pvRedrawOverlays()},
  stOkAll:()=>{const s=curS();activeKeys(s).forEach(k=>{const st=fstate(s,k);if(st.c==='s-auto'||st.c==='s-man')s.ok[k]=true});activeKeys(s).forEach(updCard);refreshMeta();toast('채워진 항목을 모두 확인 처리했어요')},
  stSave:(id,b)=>stSave(b),
  stAddComp:()=>{const s=curS();s.comps.push({name:'',cas:'',content:'',twa:'',unit:'ppm',on:true});s.src.comps=s.src.comps||'manual';renderStudio()},
  pvPrev:()=>{const v=studio.view;if(v.focus3){v.focus3=false;renderTbOnly()}if(v.page<=1)return;v.page--;v.cont?pvGoto(v.page):pvRender();renderTbOnly()},
  pvNext:()=>{const v=studio.view;if(v.focus3){v.focus3=false;renderTbOnly()}const n=curS().doc.numPages;if(v.page>=n)return;v.page++;v.cont?pvGoto(v.page):pvRender();renderTbOnly()},
  pvZoomIn:()=>{const v=studio.view;if(v.focus3){v.zoom3=Math.min(5,(v.zoom3||v.fitR||1)*1.2);return pvRender()}v.zoom=Math.min(4,(v.zoom||v.fit||1)*1.2);pvKeepPage()},
  pvZoomOut:()=>{const v=studio.view;if(v.focus3){v.zoom3=Math.max(0.4,(v.zoom3||v.fitR||1)/1.2);return pvRender()}v.zoom=Math.max(0.3,(v.zoom||v.fit||1)/1.2);pvKeepPage()},
  pvFit:()=>{const v=studio.view;if(v.focus3){v.zoom3=null;return pvRender()}v.zoom=null;pvKeepPage();renderTbOnly()},
  pvRot:()=>{const v=studio.view;v.rot=(v.rot+90)%360;v.zoom=null;pvKeepPage()},
  pvCont:()=>{const v=studio.view;v.cont=!v.cont;renderTbOnly();pvKeepPage()},
  pvShow:()=>{const v=studio.view;v.show=!v.show;renderTbOnly();pvRedrawOverlays()},
  pv3:()=>pvZoom3(),
  pvReparse:()=>{const s=curS();if(!s.text)return;applyParsed(s);s.note='';renderStudio();toast('원본을 다시 분석했어요')},
  editMsds:id=>{const m=S.msds.find(x=>x.id===id);openModal('MSDS 수정',msdsForm(m),null,()=>saveMsds(id));bindGradePreview()},
  delMsds:(id,b)=>{if(!armed(b))return;const m=S.msds.find(x=>x.id===id);S.msds=S.msds.filter(x=>x.id!==id);addLog('🗑️',m.name+' MSDS 삭제');save();render();toast('삭제했어요')},
  newReport:()=>{openModal('측정결과 등록',reportForm(),null,()=>saveReport(),true);bindReportForm()},
  editReport:id=>{const r=S.reports.find(x=>x.id===id);openModal('측정 보고서 수정',reportForm(JSON.parse(JSON.stringify(r))),null,()=>saveReport(id),true);bindReportForm()},
  delReport:(id,b)=>{if(!armed(b))return;const r=S.reports.find(x=>x.id===id);S.reports=S.reports.filter(x=>x.id!==id);addLog('🗑️',r.title+' 삭제');save();render();toast('보고서를 삭제했어요. 이미 저장된 평가 이력은 남아 있어요')},
  addRow:()=>{$('#rrows').insertAdjacentHTML('beforeend',rowHtml());},
  rmRow:(id,b)=>{const rows=$$('#rrows .rrow');if(rows.length>1)b.closest('.rrow').remove();else b.closest('.rrow').querySelectorAll('input').forEach(i=>i.value='')},
  batchAll:()=>batchAssess(S.reports),
  batchRep:id=>batchAssess(S.reports.filter(r=>r.id===id)),
  saveAssess,
  resetAssess:()=>{assessDraft=null;render()},
  editAssess,
  delAssess:(id,b)=>{if(!armed(b))return;S.assess=S.assess.filter(x=>x.id!==id);save();render();toast('평가를 삭제했어요')},
  copyTsv:()=>{const t=tsv();const fallback=()=>{openModal('엑셀용 표',`<p class="hint" style="margin-top:0">아래 내용을 전체 선택(Ctrl+A)해 복사한 뒤 엑셀에 붙여넣으세요.</p><textarea class="input mono" id="tsvBox" rows="12" readonly>${esc(t)}</textarea>`,'<button type="button" class="btn" data-act="closeModal">닫기</button>');setTimeout(()=>{const b=$('#tsvBox');b.focus();b.select()},50)};
    try{navigator.clipboard.writeText(t).then(()=>toast('복사했어요. 엑셀에 붙여넣으세요'),fallback)}catch(e){fallback()}},
  sampleMenu:()=>openModal('샘플 데이터 로드',`<p style="margin-top:0">실습용 예시 데이터를 현재 데이터에 추가해요. 예시 데이터는 대시보드의 [예시 데이터 지우기]로 한 번에 지울 수 있어요.</p>
    <div class="stack">${Object.entries(SAMPLES).map(([k,s])=>`<button type="button" class="qcard ${k==='1'?'q2':'q3'}" data-act="loadSample" data-id="${k}" style="min-height:0"><b style="margin:0">${s.label}</b><span>MSDS ${s.msds.length}종 · 측정결과 ${s.report.results.length}건 · ${esc(s.msds.map(m=>m.name).join(', '))}</span></button>`).join('')}</div>`,'<button type="button" class="btn" data-act="closeModal">닫기</button>'),
  loadSample:id=>{closeModal();loadSample(id)},
  clearSamples,
  saveSettings:()=>{
    const y=Math.max(1,Math.min(10,parseInt($('#s_years').value)||3)),w=Math.max(1,Math.min(365,parseInt($('#s_warn').value)||90));
    S.settings.company=$('#s_company').value.trim()||'(주)한솔케미칼 전주공장';
    {const la=parseFloat($('#s_lat').value),lo=parseFloat($('#s_lon').value);const prevSite=S.settings.site||{};const addrNew=$('#s_addr').value.trim()||SITE_DEFAULT.address;const llChanged=Math.abs(la-prevSite.lat)>1e-6||Math.abs(lo-prevSite.lon)>1e-6;S.settings.site={kakaoKey:$('#s_kakao').value.trim(),geo:llChanged?'manual':(addrNew!==prevSite.address?'':prevSite.geo||''),address:addrNew,lat:isFinite(la)&&la>=33&&la<=39?la:SITE_DEFAULT.lat,lon:isFinite(lo)&&lo>=124&&lo<=132?lo:SITE_DEFAULT.lon};wxCache=null;wxState='idle';try{localStorage.removeItem(KEY+':wx2')}catch(e){}}S.settings.reviewYears=y;S.settings.warnDays=w;
    S.settings.processes=[...new Set($('#s_proc').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean))];
    [4,3,2,1].forEach(g=>{S.settings.grade[g]=[...new Set(hcodes($('#s_g'+g).value).map(c=>c.slice(0,4)))]});
    addLog('📚','기준자료 설정 변경');save();render();toast('설정을 저장했어요. 새 기준은 이후 평가와 MSDS 등급 표시에 적용돼요')},
  resetGrade:()=>{S.settings.grade=JSON.parse(JSON.stringify(DEFAULT_GRADE));save();render();toast('등급 기준을 기본값으로 되돌렸어요')},
  exportData:()=>{const t=JSON.stringify(S);openModal('백업 코드',`<p class="hint" style="margin-top:0">아래 코드를 메모장 등에 붙여넣어 보관하세요. [백업 불러오기]에 붙여넣으면 그대로 복원돼요.</p><textarea class="input mono" id="bk" rows="12" readonly>${esc(t)}</textarea>`,'<button type="button" class="btn" data-act="closeModal">닫기</button><button type="button" class="btn primary" data-act="copyBackup">복사</button>')},
  copyBackup:()=>{const b=$('#bk');try{navigator.clipboard.writeText(b.value).then(()=>toast('백업 코드를 복사했어요'),()=>{b.focus();b.select();toast('선택된 코드를 Ctrl+C로 복사하세요')})}catch(e){b.focus();b.select()}},
  importData:()=>{openModal('백업 불러오기',`<p class="hint" style="margin-top:0">백업 코드를 붙여넣거나 백업 파일(.json, .txt)을 고르세요. <b>현재 데이터는 모두 바뀌어요.</b></p><textarea class="input mono" id="imp" rows="10" placeholder='{"msds":[...]}'></textarea><input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" style="margin-top:10px">`,'<button type="button" class="btn" data-act="closeModal">취소</button><button type="submit" class="btn primary">불러오기</button>',()=>{
      try{const d=JSON.parse($('#imp').value);if(!d||!Array.isArray(d.msds))throw 0;S=Object.assign(blank(),d);S.settings=Object.assign(defaultSettings(),d.settings||{});addLog('📥','백업 데이터 복원');save();render();toast('복원했어요')}catch(e){toast('백업 코드 형식이 맞지 않아요. 복사한 내용 전체를 붙여넣었는지 확인하세요');return false}});
    $('#impFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=r.result};r.readAsText(f)})},
  resetAll:(id,b)=>{if(!armed(b,'한 번 더 누르면 전체 삭제'))return;S=blank();addLog('🧹','전체 데이터 초기화');save();assessDraft=null;tab='dash';render();toast('모든 데이터를 지웠어요')}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const fn=ACT[b.dataset.act];if(!fn)return;
  if(b.tagName==='BUTTON'&&b.type!=='submit')e.preventDefault();
  fn(b.dataset.id,b,e);
});
document.addEventListener('input',e=>{
  if(e.target.id==='msdsQ'){msdsFilter.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#msdsQ');i.focus();i.setSelectionRange(pos,pos)}
  if(e.target.id==='measQ'){measQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#measQ');i.focus();i.setSelectionRange(pos,pos)}
  if(e.target.id==='histQ'){histFilter.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#histQ');i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='msdsSt'){msdsFilter.st=e.target.value;render()}
  if(e.target.id==='msdsG'){msdsFilter.g=e.target.value;render()}
  if(e.target.id==='histLv'){histFilter.lv=e.target.value;render()}
  if(e.target.id==='histSt'){histFilter.st=e.target.value;render()}
});
const _render=render;
render=function(){_render();if(tab==='dash'){if(wxState==='idle')loadWeather();initMap()}const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v};set('msdsSt',msdsFilter.st);set('msdsG',msdsFilter.g);set('histLv',histFilter.lv);set('histSt',histFilter.st)};

if(firstRun){loadSample('1',true);loadSample('2',true);S.log=[];addLog('📝','실습 #1, #2 샘플 데이터 로드');save()}
try{const a=localStorage.getItem(KEY+':mv'),b=localStorage.getItem(KEY+':xv');if(a==='group'||a==='list')msdsView=a;if(['time','place','agent'].includes(b))measView=b}catch(e){}
const h=(location.hash||'').slice(1);if(VIEWS[h])tab=h;
render();
})();
</script>

</body>
</html>
